<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Interactive Registration Form</title>
</head>

<body>
    <div class="container">
        <h1>Register</h1>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required minlength="3" pattern="[A-Za-z0-9_]+"
                    autocomplete="username" aria-describedby="usernameError">
                <span class="error-message" id="usernameError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required autocomplete="email" aria-describedby="emailError">
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="8"
                    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}" autocomplete="new-password"
                    aria-describedby="passwordHint passwordError">

                <small id="passwordHint">
                    Password must be at least 8 characters long,
                    include an uppercase letter, a lowercase letter,
                    and a number.
                </small>

                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password"
                    aria-describedby="confirmPasswordError">
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <button type="submit">Register</button>

            <p id="successMessage" role="status" aria-live="polite"></p>

        </form>
    </div>

    <script src="script.js"></script>
</body>

</html>
